function camEye(out){
  const ce = Math.cos(cam.el), se = Math.sin(cam.el);
  out[0] = cam.tx + cam.dist*ce*Math.sin(cam.az);
  out[1] = cam.ty + cam.dist*se;
  out[2] = cam.tz + cam.dist*ce*Math.cos(cam.az);
  return out;
}
const eyeV = [0,0,0], tgtV = [0,0,0];
function setCamMatrices(aspect){
  camEye(eyeV); tgtV[0]=cam.tx; tgtV[1]=cam.ty; tgtV[2]=cam.tz;
  lookAt(M.view, eyeV, tgtV, [0,1,0]);
  persp(M.proj, 0.72, aspect, 0.6, 6000);
  mul(M.vp, M.proj, M.view);
  inv4(M.ivp, M.vp);
  // mirror about the water plane
  ident(M.mirror);
  M.mirror[5] = -1; M.mirror[13] = 2*WY;
  mul(M.rview, M.view, M.mirror);
  mul(M.rvp, M.proj, M.rview);
  inv4(M.rivp, M.rvp);
  // light
  const sd = env.sun;
  const lp = [cam.tx + sd[0]*300, 40 + sd[1]*300, cam.tz + sd[2]*300];
  const up = Math.abs(sd[1]) > 0.98 ? [0,0,1] : [0,1,0];
  lookAt(M.lview, lp, [0,34,0], up);
  ortho(M.lproj, -175,175,-175,175, 1, 620);
  mul(M.lightVP, M.lproj, M.lview);
}

/* ---- koi + birds instance data ---- */
function pushBox(pos, r, u, f, col){
  const o = boxCount*15;
  boxData[o]=pos[0]; boxData[o+1]=pos[1]; boxData[o+2]=pos[2];
  boxData[o+3]=r[0]; boxData[o+4]=r[1]; boxData[o+5]=r[2];
  boxData[o+6]=u[0]; boxData[o+7]=u[1]; boxData[o+8]=u[2];
  boxData[o+9]=f[0]; boxData[o+10]=f[1]; boxData[o+11]=f[2];
  boxData[o+12]=col[0]; boxData[o+13]=col[1]; boxData[o+14]=col[2];
  boxCount++;
}
function updateKoiAndBirds(t){
  boxCount = 0;
  for(const k of koi){
    const a = k.ph + t*k.spd*0.35;
    const x = Math.cos(a)*k.rad, z = Math.sin(a)*k.rad*0.82;
    const nx = Math.cos(a+0.02)*k.rad, nz = Math.sin(a+0.02)*k.rad*0.82;
    let fwd = nrm3([nx-x, 0, nz-z]);
    const right = nrm3(cross(fwd, [0,1,0]));
    fwd = nrm3(cross(right, [0,1,0]));
    const y = k.y + Math.sin(t*0.7 + k.bob)*0.8;
    const tail = Math.sin(t*6.0 + k.bob)*0.5;
    const c = [((k.col>>16)&255)/255, ((k.col>>8)&255)/255, (k.col&255)/255];
    const L = 2.4*k.sc, W = 0.75*k.sc, H = 0.9*k.sc;
    pushBox([x, y, z], mulv(right, W), mulv(fwd, L), [0, H, 0], c);
    const tc = [0.92,0.86,0.78];
    const tf = [fwd[0]+right[0]*tail, fwd[1], fwd[2]+right[2]*tail];
    pushBox([x+tf[0]*L*0.9, y+0.1, z+tf[2]*L*0.9], mulv(nrm3(cross(tf,[0,1,0])), 0.15*k.sc), mulv(nrm3(tf), 1.3*k.sc), [0, 0.9*k.sc, 0], tc);
  }
  for(const b of birds){
    const a = b.ph + t*b.spd*0.22;
    const x = Math.cos(a)*b.r, z = Math.sin(a)*b.r*0.9;
    const y = b.h + Math.sin(t*0.4 + b.ph)*2.5;
    const nx = Math.cos(a+0.02)*b.r, nz = Math.sin(a+0.02)*b.r*0.9;
    const fwd = nrm3([nx-x, 0, nz-z]);
    const right = nrm3(cross(fwd, [0,1,0]));
    const c = [0.16,0.15,0.18];
    pushBox([x,y,z], mulv(right, 0.28*b.sc), mulv(fwd, 0.9*b.sc), [0,0.28*b.sc,0], c);
    const flap = Math.sin(t*7.0 + b.fl)*0.8;
    for(const s of [-1,1]){
      const wing = nrm3([right[0]*s*0.9, right[1]*s*0.9 + flap, right[2]*s*0.9]);
      pushBox([x + right[0]*s*1.1*b.sc + wing[0]*0.6, y + wing[1]*0.6*b.sc, z + right[2]*s*1.1*b.sc + wing[2]*0.6],
        mulv(right, 1.5*b.sc), mulv(wing, 0.12*b.sc), [0,0,0], c);
    }
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, boxInst);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, boxData.subarray(0, boxCount*15));
}
function mulv(v,s){ return [v[0]*s, v[1]*s, v[2]*s]; }

/* ==========================================================================
   11. drawing
   ========================================================================== */
function bindTex(unit, tex){ gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D, tex); }

function commonUniforms(pr, vp, inv, camPos, clipY, useShadow){
  const u = pr.u.bind(pr);
  gl.uniformMatrix4fv(u('uVP'), false, vp);
  gl.uniformMatrix4fv(u('uInvVP'), false, inv);
  gl.uniform3fv(u('uSunDir'), env.sun);
  gl.uniform3fv(u('uSunCol'), env.sunCol);
  gl.uniform3fv(u('uSkyCol'), env.sky);
  gl.uniform3fv(u('uGndCol'), env.gnd);
  gl.uniform3fv(u('uFogCol'), env.fog);
  gl.uniform3f(u('uCam'), camPos[0], camPos[1], camPos[2]);
  gl.uniform1f(u('uClipY'), clipY);
  gl.uniform1f(u('uFogDen'), env.fogDen);
  gl.uniform1f(u('uTime'), time);
  gl.uniform1f(u('uShadows'), (useShadow && shadowsOK) ? 1 : 0);
  gl.uniform1f(u('uShadowTexel'), 1/SHADOW);
  gl.uniform3fv(u('uGlow'), [env.glow, env.glow*0.94, env.glow*0.82]);
  if(u('uLP')) gl.uniform3fv(u('uLP'), LP);
  if(u('uLC')) gl.uniform3fv(u('uLC'), LC);
  if(u('uNL'))  gl.uniform1i(u('uNL'), NL);
  /* the shadow sampler must always point at a depth texture, even when unused */
  if(u('uShadow')){ bindTex(0, shadowsOK ? shadowTex : RT.brightTex); gl.uniform1i(u('uShadow'), 0); }
}

function drawVoxels(vp, inv, camPos, clipY, useShadow, lightVP){
  if(instCount===0) return;
  gl.useProgram(pVox.p);
  gl.uniformMatrix4fv(pVox.u('uLightVP'), false, lightVP);
  commonUniforms(pVox, vp, inv, camPos, clipY, useShadow);
  gl.bindVertexArray(vaoVox);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, instCount);
}

function drawSky(vp, inv, camPos, clipY){
  gl.useProgram(pSky.p);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.uniformMatrix4fv(pSky.u('uInvVP'), false, inv);
  gl.uniform3fv(pSky.u('uSunDir'), env.sun);
  gl.uniform3fv(pSky.u('uSunCol'), env.sunCol);
  gl.uniform3fv(pSky.u('uZenith'), env.zenith);
  gl.uniform3fv(pSky.u('uHorizon'), env.horizon);
  gl.uniform3fv(pSky.u('uGround'), env.gnd);
  gl.uniform3fv(pSky.u('uFogCol'), env.fog);
  gl.uniform3fv(pSky.u('uCloudCol'), env.cloud);
  gl.uniform3fv(pSky.u('uCloudDark'), env.cloudDk);
  gl.uniform3fv(pSky.u('uMoonDir'), env.moon);
  gl.uniform1f(pSky.u('uTime'), time);
  gl.uniform1f(pSky.u('uNight'), env.night);
  gl.uniform1f(pSky.u('uStars'), env.stars);
  gl.uniform1f(pSky.u('uCloudAmt'), env.cloudAmt);
  gl.bindVertexArray(vaoPost);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}

function drawBoxes(vp, inv, camPos, clipY, emis){
  if(boxCount===0) return;
  gl.useProgram(pBox.p);
  commonUniforms(pBox, vp, inv, camPos, clipY, false);
  gl.uniform1f(pBox.u('uEmis'), emis);
  gl.bindVertexArray(vaoBox);
  gl.drawElementsInstanced(gl.TRIANGLES, 36, gl.UNSIGNED_SHORT, 0, boxCount);
}

function drawShadowPass(){
  if(!shadowsOK || quality<1) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
  gl.viewport(0,0,SHADOW,SHADOW);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.useProgram(pVoxD.p);
  gl.uniformMatrix4fv(pVoxD.u('uVP'), false, M.lightVP);
  gl.uniformMatrix4fv(pVoxD.u('uLightVP'), false, M.lightVP);
  gl.bindVertexArray(vaoVox);
  gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, instCount);
  gl.bindVertexArray(null);
}

function renderScene(vp, inv, camPos, clipY, useShadow, w, h, withWater, withParticles){
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  drawSky(vp, inv, camPos, clipY);
  drawVoxels(vp, inv, camPos, clipY, useShadow, M.lightVP);
  drawBoxes(vp, inv, camPos, clipY, 0.0);
  if(withWater){
    gl.useProgram(pWater.p);
    gl.uniformMatrix4fv(pWater.u('uVP'), false, vp);
    gl.uniform3fv(pWater.u('uSunDir'), env.sun);
    gl.uniform3fv(pWater.u('uSunCol'), env.sunCol);
    gl.uniform3fv(pWater.u('uCam'), camPos);
    gl.uniform3fv(pWater.u('uDeep'), env.deep);
    gl.uniform3fv(pWater.u('uShallow'), env.shallow);
    gl.uniform3fv(pWater.u('uFogCol'), env.fog);
    gl.uniform3fv(pWater.u('uPetal'), env.petal);
    gl.uniform1f(pWater.u('uTime'), time);
    gl.uniform1f(pWater.u('uFogDen'), env.fogDen);
    gl.uniform1f(pWater.u('uSparkle'), env.sparkle);
    gl.uniform1f(pWater.u('uWY'), WY);
    gl.uniform1f(pWater.u('uExt'), 2200);
    bindTex(0, RT.reflTex);
    gl.uniform1i(pWater.u('uRefl'), 0);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindVertexArray(vaoWater);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disable(gl.BLEND);
  }
  if(withParticles && showPetals){
    gl.useProgram(pPetal.p);
    gl.uniformMatrix4fv(pPetal.u('uVP'), false, vp);
    gl.uniformMatrix4fv(pPetal.u('uView'), false, (vp===M.rvp) ? M.rview : M.view);
    gl.uniform1f(pPetal.u('uTime'), time);
    gl.uniform1f(pPetal.u('uTop'), petalInst.top);
    gl.uniform1f(pPetal.u('uRange'), 26);
    gl.uniform3fv(pPetal.u('uSunCol'), env.sunCol);
    gl.uniform3fv(pPetal.u('uSkyCol'), env.sky);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.disable(gl.CULL_FACE);
    gl.bindVertexArray(vaoPetal);
    gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, petalCount);
    gl.disable(gl.BLEND);

    gl.useProgram(pFF.p);
    gl.uniformMatrix4fv(pFF.u('uVP'), false, vp);
    gl.uniform1f(pFF.u('uTime'), time);
    gl.uniform1f(pFF.u('uNight'), env.firefly);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(vaoFF);
    gl.drawArrays(gl.POINTS, 0, ffCount);
    gl.disable(gl.BLEND);
  }
}

function blitToScreen(srcTex, w, h){
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER, RT.ms ? RT.msFBO : RT.sceneFBO);
  gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, RT.sceneFBO);
  gl.blitFramebuffer(0,0,w,h, 0,0,w,h, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function postProcess(w, h){
  const useBloom = quality>0;
  if(useBloom){
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    gl.bindVertexArray(vaoPost);
    // bright pass
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.brightFBO);
    gl.viewport(0,0,Math.max(2,w>>1), Math.max(2,h>>1));
    gl.useProgram(pBright.p);
    bindTex(0, RT.sceneTex);
    gl.uniform1i(pBright.u('uTex'), 0);
    gl.uniform1f(pBright.u('uThresh'), env.thresh);
    gl.uniform1f(pBright.u('uKnee'), 0.55);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // chain
    let src = RT.bright, sw = Math.max(2,w>>1), sh = Math.max(2,h>>1);
    for(let i=0;i<3;i++){
      const L = RT.lv[i];
      gl.bindFramebuffer(gl.FRAMEBUFFER, L.fboA);
      gl.viewport(0,0,L.w,L.h);
      gl.useProgram(pDown.p);
      bindTex(0, src);
      gl.uniform1i(pDown.u('uTex'), 0);
      gl.uniform2f(pDown.u('uTexel'), 1/sw, 1/sh);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.useProgram(pBlur.p);
      gl.uniform1i(pBlur.u('uTex'), 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, L.fboB);
      bindTex(0, L.a);
      gl.uniform2f(pBlur.u('uDir'), 1/L.w, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, L.fboA);
      bindTex(0, L.b);
      gl.uniform2f(pBlur.u('uDir'), 0, 1/L.h);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      src = L.a; sw = L.w; sh = L.h;
    }
  }
  // composite
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,w,h);
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.useProgram(pComp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.sceneTex);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, useBloom ? RT.lv[0].a : RT.brightTex);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, useBloom ? RT.lv[1].a : RT.brightTex);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, useBloom ? RT.lv[2].a : RT.brightTex);
  gl.uniform1i(pComp.u('uScene'), 0);
  gl.uniform1i(pComp.u('uB0'), 1);
  gl.uniform1i(pComp.u('uB1'), 2);
  gl.uniform1i(pComp.u('uB2'), 3);
  gl.uniform1f(pComp.u('uExposure'), env.exp);
  gl.uniform1f(pComp.u('uBloom'), useBloom ? env.bloom : 0);
  gl.uniform1f(pComp.u('uCA'), 0.0011);
  gl.uniform1f(pComp.u('uGrain'), 0.014);
  gl.uniform1f(pComp.u('uVig'), 0.85);
  gl.uniform1f(pComp.u('uTime'), time);
  gl.bindVertexArray(vaoPost);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
}

function frame(dt){
  /* camera smoothing */
  if(autoOrbit) camT.az += dt*0.055;
  cam.az = lerp(cam.az, camT.az, 1-Math.pow(0.0015, dt));
  cam.el = lerp(cam.el, camT.el, 1-Math.pow(0.0015, dt));
  cam.dist = lerp(cam.dist, camT.dist, 1-Math.pow(0.002, dt));
  cam.tx = lerp(cam.tx, camT.tx, 1-Math.pow(0.002, dt));
  cam.ty = lerp(cam.ty, camT.ty, 1-Math.pow(0.002, dt));
  cam.tz = lerp(cam.tz, camT.tz, 1-Math.pow(0.002, dt));

  tickEnv(dt);
  updateLights();
  updateKoiAndBirds(time);
  setCamMatrices(canvas.width/Math.max(1,canvas.height));
  camEye(eyeV);

  const w = RT.w, h = RT.h;

  drawShadowPass();

  /* planar reflection */
  if(quality>0){
    gl.bindFramebuffer(gl.FRAMEBUFFER, RT.reflFBO);
    gl.viewport(0,0,RT.reflW,RT.reflH);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    renderScene(M.rvp, M.rivp, [eyeV[0], 2*WY-eyeV[1], eyeV[2]], WY-0.15, false, RT.reflW, RT.reflH, false, false);
  }

  /* main */
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.mainFBO);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.disable(gl.BLEND);
  renderScene(M.vp, M.ivp, eyeV, -1e9, true, w, h, true, true);

  if(RT.ms) blitToScreen(null, w, h);
  postProcess(w, h);
  gl.bindVertexArray(null);
}

/* ==========================================================================
   12. input, resize, boot
   ========================================================================== */
function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, quality>1 ? 1.75 : 1.25);
  const w = Math.max(2, Math.round(canvas.clientWidth  * dpr));
  const h = Math.max(2, Math.round(canvas.clientHeight * dpr));
  if(w === canvas.width && h === canvas.height && RT) return;
  canvas.width = w; canvas.height = h;
  freeRT(RT);
  RT = makeRT(w, h);
}

let dragging=false, px=0, py=0;
canvas.addEventListener('pointerdown', e=>{
  dragging=true; px=e.clientX; py=e.clientY; autoOrbit=false; idleT=0;
  canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId);
  syncToggle('orbit', false);
});
canvas.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX-px, dy = e.clientY-py; px=e.clientX; py=e.clientY;
  camT.az -= dx*0.006;
  camT.el = clamp(camT.el + dy*0.005, 0.045, 1.32);
});
const endDrag = e => { dragging=false; canvas.classList.remove('drag'); idleT=0; };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camT.dist = clamp(camT.dist * Math.exp(e.deltaY*0.0011), 70, 720);
}, {passive:false});
canvas.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
canvas.addEventListener('dblclick', ()=>{ camT.dist=248; camT.ty=28; camT.az=0.18; camT.el=0.47; });

/* ---- buttons ---- */
const BTN = {};
function mkBtn(host, key, label, fn){
  const b = document.createElement('button');
  b.textContent = label; b.dataset.v = key;
  b.addEventListener('click', ()=>{ fn(key); });
  host.appendChild(b);
  BTN[key] = b;
  return b;
}
function syncToggle(key, on){ if(BTN[key]) BTN[key].classList.toggle('on', !!on); }

function buildUI(){
  const t = $('#grpTime');
  for(const k of ['dawn','day','gold','night']) mkBtn(t, 'time-'+k, PRESETS[k].label, ()=> setPreset(k));
  const q = $('#grpQ');
  mkBtn(q, 'q0', 'Low',    ()=>{ quality=0; syncQuality(); });
  mkBtn(q, 'q1', 'Medium', ()=>{ quality=1; syncQuality(); });
  mkBtn(q, 'q2', 'High',   ()=>{ quality=2; syncQuality(); });
  const m = $('#grpMisc');
  mkBtn(m, 'orbit', 'Orbit', ()=>{ autoOrbit=!autoOrbit; syncToggle('orbit', autoOrbit); });
  mkBtn(m, 'petals','Petals', ()=>{ showPetals=!showPetals; syncToggle('petals', showPetals); });
  syncQuality();
  syncToggle('orbit', autoOrbit);
  syncToggle('petals', showPetals);
}
function syncQuality(){
  syncToggle('q0', quality===0); syncToggle('q1', quality===1); syncToggle('q2', quality===2);
}

/* ---- boot ---- */
const loadEl = $('#load'), barEl = $('#fillbar'), msgEl = $('#loadmsg');
function setLoad(frac, msg){ barEl.style.width = (frac*100).toFixed(1)+'%'; if(msg) msgEl.textContent = msg; }

const nextFrame = () => new Promise(r => requestAnimationFrame(r));

async function boot(){
  resize();
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0,0,0,1);

  setLoad(0.02, 'compiling shaders');
  await nextFrame();
  initPrograms();
  initShadow();
  initBox();
  vaoWater = gl.createVertexArray();

  setLoad(0.06, 'raising the mountains');
  await nextFrame();

  /* run the build steps, yielding between each so the bar animates */
  planScene();
  const per = 0.82 / buildSteps.length;
  for(let i=0;i<buildSteps.length;i++){
    msgEl.textContent = buildSteps[i].msg;
    setLoad(0.06 + per*i, buildSteps[i].msg);
    await nextFrame();
    buildSteps[i].f();
  }
  setLoad(0.90, 'sculping the voxels');
  await nextFrame();

  const mesh = buildVoxelMesh();
  setLoad(0.96, 'uploading ' + (mesh.count/1000).toFixed(0) + 'k faces');
  await nextFrame();
  uploadVoxels(mesh);

  setLoad(0.98, 'letting the petals fall');
  await nextFrame();
  initPetals(quality>1 ? 900 : 420);
  initFireflies(quality>1 ? 220 : 90);

  setPreset('gold', true);
  buildUI();
  resize();
  cam.az = camT.az = 0.18; cam.el = camT.el = 0.47; cam.dist = camT.dist = 300;

  setLoad(1, 'ready');
  await nextFrame();
  loadEl.classList.add('gone');

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now; time += dt;
    fpsAcc += dt; frames++;
    if(fpsAcc > 0.5){ fps = frames/fpsAcc; frames=0; fpsAcc=0; adaptQuality(); }
    if(!dragging){ idleT += dt; }
    try { frame(dt); } catch(err){ console.error(err); }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

let adaptCooldown = 6;
function adaptQuality(){
  if(adaptCooldown > 0){ adaptCooldown--; return; }
  if(fps < 24 && quality > 0){
    quality--; syncQuality(); resize(); adaptCooldown = 8;
    if(quality>0) initPetals(quality>1 ? 900 : 420);
  } else if(fps > 55 && quality < 2 && adaptCooldown < 0){
    quality++; syncQuality(); resize(); adaptCooldown = 10;
  }
}

window.addEventListener('resize', ()=>{ resize(); });

boot().catch(err=>{
  console.error(err);
  loadEl.classList.add('gone');
  $('#err').style.display='flex';
  $('#err').innerHTML = 'Something went wrong while building the scene.<br><span style="opacity:.5;font-size:12px">' +
    String(err && err.message || err) + '</span>';
});

})();
</script>
