<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  var uniforms = {
    uTime: { value: 0 },
    uResolution: { value: new THREE.Vector2(1, 1) }
  };

  var material = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: `
      void main() {
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec2 uResolution;
      uniform float uTime;

      #define TAU 6.28318530718

      float tunnelDetail(vec2 p, float t) {
        float sum = 0.0;
        float amp = 0.55;
        for (int i = 0; i < 4; i++) {
          float fi = float(i);
          float fx = 3.0 * pow(2.0, fi);
          float fy = 1.7 * pow(2.0, fi);
          float ph = t * (0.5 + 0.37 * fi);
          sum += amp * sin(p.x * TAU * fx + p.y * fy + ph);
          sum += amp * 0.6 * sin(p.x * TAU * fx * 2.0 - p.y * fy * 1.31 - ph * 1.7);
          amp *= 0.52;
        }
        return sum;
      }

      void main() {
        vec2 res = uResolution;
        vec2 uv = (gl_FragCoord.xy * 2.0 - res) / min(res.x, res.y);

        float r = length(uv);
        float ang = atan(uv.y, uv.x) / TAU;
        float t = uTime;

        float depth = 0.6 / (r + 0.12);

        vec2 wall = vec2(ang, depth + t * 0.6);
        float d = tunnelDetail(wall, t);

        float fade = smoothstep(0.02, 0.55, r);

        float bands = 0.5 + 0.5 * sin(ang * TAU * 14.0 + d * 1.6);
        float rings = 0.5 + 0.5 * sin(depth * 4.5 + t * 2.2 + d * 1.1);

        float e = clamp(bands * 0.58 + rings * 0.48 + d * 0.06, 0.0, 1.3);
        float energy = pow(e, 2.0) * fade;

        vec3 deepBlue = vec3(0.015, 0.04, 0.22);
        vec3 violet   = vec3(0.32, 0.10, 0.62);
        vec3 magenta  = vec3(0.98, 0.16, 0.78);
        vec3 cyan     = vec3(0.15, 0.92, 1.00);

        vec3 col = deepBlue;
        col = mix(col, violet,  smoothstep(0.05, 0.50, energy));
        col = mix(col, magenta, smoothstep(0.35, 0.85, energy));
        col = mix(col, cyan,    smoothstep(0.65, 1.20, energy));
        col += (cyan * 0.6 + vec3(0.4)) * smoothstep(1.05, 1.60, energy);

        float halo = 0.5 + 0.5 * sin(ang * TAU * 4.0 - depth * 1.3 + t * 0.9);
        col += magenta * halo * 0.08 + cyan * halo * halo * 0.07;

        col *= smoothstep(0.0, 0.38, r);

        vec2 q = gl_FragCoord.xy / res - 0.5;
        float vig = clamp(1.0 - dot(q, q) * 1.15, 0.0, 1.0);
        col *= vig;

        col = pow(max(col, vec3(0.0)), vec3(0.88));

        gl_FragColor = vec4(col, 1.0);
      }
    `
  });

  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

  function resize() {
    var pr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pr);
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.uResolution.value.set(
      Math.floor(window.innerWidth * pr),
      Math.floor(window.innerHeight * pr)
    );
  }

  window.addEventListener("resize", resize);
  resize();

  var clock = new THREE.Clock();

  function animate() {
    uniforms.uTime.value = clock.getElapsedTime();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
